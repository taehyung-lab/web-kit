name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # format:check의 tailwind 정렬은 apps/starter/src/styles.css의 import(tw-animate-css·shadcn)를 starter 의존성에서 읽는다.
      # starter는 workspace 밖이라 따로 설치하지 않으면 클래스 순서를 다르게 판정한다.
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
        working-directory: apps/starter
      # check는 고정 shadcn 재빌드와 커밋된 public/r 산출물 일치도 확인한다.
      - run: pnpm check
  # 발행할 산출물 그대로 같은 commit의 apps/starter에 설치해 소비 쪽 검사(check·브라우저)를 돌린다.
  # starter lockfile의 키트 지문이 이 산출물과 다르면 실패한다: 키트를 바꾼 PR은 starter도 함께 맞춘다.
  # 통과한 tarball을 artifact로 남기고 release에는 이것을 올린다.
  consumer:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/sync-starter.mjs --frozen
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/starter
      # starter:check는 단위·브라우저 적합성 결과와 복사본 지문 점검을 필수 실행한다.
      - run: pnpm starter:check
      # 전체 starter의 peer 설치가 가리지 않는 실제 선택 소비도 같은 후보로 실행한다.
      - run: pnpm consumer:minimal --report-dir work/form-flexibility/minimal-consumption
      # 새 프로젝트(starter:create)가 예시 업무 없이 설치·검사를 통과하고, 기본 골격으로 첫 업무 네 화면을 만들 수 있는지 본다.
      - name: 새 프로젝트 수용 검사
        run: |
          git clone --quiet https://github.com/taehyung-lab/agent-workflow-kit "$RUNNER_TEMP/agent-workflow-kit"
          git -C "$RUNNER_TEMP/agent-workflow-kit" checkout --quiet "$(cat scripts/starter/agent-workflow-kit.version)"
          pnpm starter:acceptance --workflow-kit "$RUNNER_TEMP/agent-workflow-kit"
      - name: 검증한 commit과 산출물 기록
        run: node scripts/write-verification.mjs packages/web-kit dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-kit-tarball
          path: |
            dist/boosterlab-web-kit-*.tgz
            dist/verification.json
