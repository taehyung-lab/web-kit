name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # check는 고정 shadcn 재빌드와 커밋된 public/r 산출물 일치도 확인한다.
      - run: pnpm check
  # 발행할 산출물 그대로 같은 commit의 apps/starter에 설치해 소비 쪽 검사(check·브라우저)를 돌린다.
  # starter lockfile의 키트 지문이 이 산출물과 다르면 실패한다: 키트를 바꾼 PR은 starter도 함께 맞춘다.
  # 통과한 tarball을 artifact로 남기고 release에는 이것을 올린다.
  consumer:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm starter:check
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/starter
      - run: pnpm test:e2e
        working-directory: apps/starter
      - name: 검증한 commit과 산출물 기록
        run: node scripts/write-verification.mjs packages/web-kit dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-kit-tarball
          path: |
            dist/boosterlab-web-kit-*.tgz
            dist/verification.json
